[project]
name = "ewe-mcp"
version = "0.1.0"
description = "Model Context Protocol bridge for Ecopath with Ecosim"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "pytest-timeout>=2.4.0",
]

[project.scripts]
ewe-mcp = "ewe_mcp.server:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.20.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ewe_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: tests requiring a running EwE instance",
]
